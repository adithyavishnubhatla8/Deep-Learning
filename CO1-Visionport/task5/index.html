<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionPort - Task 5: Extract Video Frames</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 30px 16px; }
        .container { max-width: 960px; margin: auto; background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 28px; box-shadow: 0 12px 30px rgba(0,0,0,0.45); }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .badge { background: #10b981; color: #fff; font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 999px; }
        h1 { font-size: 22px; margin: 0; color: #f8fafc; }
        .subtitle { color: #94a3b8; margin: 6px 0 22px 0; font-size: 14px; }
        .upload-box { border: 2px dashed #475569; background: #0f172a; border-radius: 10px; padding: 22px; text-align: center; margin-bottom: 18px; }
        input[type="file"], input[type="number"] { color: #e2e8f0; background: #1e293b; border: 1px solid #475569; padding: 8px 12px; border-radius: 6px; margin: 6px; }
        button, .download-btn { background: #10b981; color: #fff; border: none; padding: 11px 22px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 10px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 12px; font-size: 14px; font-weight: 600; color: #38bdf8; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 20px; }
        .frame-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; overflow: hidden; text-align: center; padding-bottom: 8px; }
        .frame-card img { width: 100%; height: 120px; object-fit: cover; display: block; }
        .frame-card span { font-size: 12px; color: #94a3b8; display: block; margin-top: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><span class="badge">TASK 5</span><h1>Extract Individual Frames from Traffic Video</h1></div>
        <p class="subtitle">Extracts video frames at your chosen interval, displays every saved image below, and bundles a downloadable ZIP.</p>
        <div class="upload-box">
            <input type="file" id="videoFile" accept="video/*"><br>
            <label for="frameStep" style="font-size:14px; color:#cbd5e1;">Save every Nth frame:</label>
            <input type="number" id="frameStep" value="25" min="1" max="300"><br>
            <button id="extractBtn" onclick="extractFrames()">Extract Frames</button>
            <div id="statusMsg" class="status"></div>
            <div id="zipArea"></div>
        </div>
        <div id="gallery" class="gallery"></div>
    </div>
    <script>
        async function extractFrames() {
            const fileInput = document.getElementById('videoFile');
            const step = document.getElementById('frameStep').value || 25;
            const statusMsg = document.getElementById('statusMsg');
            const gallery = document.getElementById('gallery');
            const zipArea = document.getElementById('zipArea');
            const btn = document.getElementById('extractBtn');

            if (!fileInput.files.length) {
                statusMsg.innerHTML = '<span style="color:#f87171;">Please select a video file first.</span>';
                return;
            }
            const fd = new FormData();
            fd.append('file', fileInput.files[0]);
            btn.disabled = true;
            statusMsg.innerText = 'Extracting frames from video...';
            gallery.innerHTML = '';
            zipArea.innerHTML = '';

            try {
                const res = await fetch(`/extract-frames/?step=${encodeURIComponent(step)}`, { method: 'POST', body: fd });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Frame extraction failed.');

                statusMsg.innerText = `Extracted ${data.extracted_count} frames out of ${data.total_video_frames} total video frames!`;
                zipArea.innerHTML = `<a class="download-btn" href="${data.zip_url}" download="Task5_Extracted_Frames.zip">Download All Frames (.ZIP)</a>`;

                data.frame_urls.forEach((url, idx) => {
                    const card = document.createElement('div');
                    card.className = 'frame-card';
                    card.innerHTML = `<img src="${url}" alt="Frame ${idx}"><span>Frame #${idx + 1}</span>`;
                    gallery.appendChild(card);
                });
            } catch (err) {
                statusMsg.innerHTML = `<span style="color:#f87171;">Error: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
